name: Validate and release
on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.3
      - run: go test -race ./...
      - run: go vet ./...
      - run: bash -n scripts/install.sh scripts/test-install.sh scripts/test-install-dsm.sh && bash scripts/test-install.sh && bash scripts/test-install-dsm.sh
      - run: npm ci && npm test && npm audit --audit-level=high
        working-directory: frontend
      - run: sh scripts/build.sh
      - run: node scripts/smoke.mjs dist/modudock-linux-amd64
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: windows, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: darwin, arch: amd64 }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.3
      - run: sh scripts/build.sh
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          MODUDOCK_VERSION: ${{ github.ref_name }}
      - run: |
          cp README.md LICENSE dist/
          cp scripts/install.sh dist/
          cp -r docs packaging dist/
          tar -czf modudock-${{ matrix.os }}-${{ matrix.arch }}.tar.gz -C dist .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: modudock-${{ matrix.os }}-${{ matrix.arch }}
          path: modudock-*.tar.gz

  publish:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release
          pattern: modudock-*
          merge-multiple: true
      - run: sha256sum *.tar.gz > SHA256SUMS
        working-directory: release
      - run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha

name: modudock-go
services:
  app:
    image: ${MODUDOCK_IMAGE:-modudock-go:local}
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${MODUDOCK_BIND:-127.0.0.1}:${MODUDOCK_PORT:-7438}:7438"
    command: ["serve", "--data-dir", "/data", "--listen", "0.0.0.0:7438", "--public-url", "${MODUDOCK_PUBLIC_URL:-}"]
    volumes:
      - modudock-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 30s
volumes:
  modudock-data:
